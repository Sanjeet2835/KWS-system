[platformio]
default_envs = s3node

[env:s3node]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 921600
upload_speed = 921600
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi

# TensorFlow Lite Micro with Espressif's ESP-NN kernels. ESP_NN +
# CONFIG_NN_OPTIMIZED + ARCH_ESP32_S3 select the S3 SIMD assembly paths, which
# is where the 4-8x INT8 conv speedup comes from.
lib_deps = https://github.com/Nickjgniklu/ESP_TF.git
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DKEYWORD=\"marvin\"
    -DESP_NN
    -DCONFIG_NN_OPTIMIZED
    -DARCH_ESP32_S3
    # Arduino's default 8 KB loopTask stack is not enough headroom for the deep
    # WiFi/TCP call chains this loop makes.
    -DARDUINO_LOOP_STACK_SIZE=16384
# Port is auto-detected (macOS renames cu.usbmodem* / cu.usbserial* on replug).
# Override with: pio run -t upload --upload-port /dev/cu.usbserial-XXXX
monitor_dtr = 0
monitor_rts = 0

[env:s3profile]
extends = env:s3node
build_flags =
    ${env:s3node.build_flags}
    -DKWS_PROFILE=1
